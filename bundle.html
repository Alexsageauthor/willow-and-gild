<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#F8F6F2">
<title>Bundle — Willow &amp; Gild</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ONE PAGE SERVES ALL EIGHT BUNDLES, exactly as collection.html serves all
   fifteen collections. It reads ?b=<id>&c=<collection> so the same bundle can
   be shown in any collection's colours — the Invitation Suite in Kyoto's gold
   or English Rose's — without a second file. */
html{color-scheme:light only;background:#F8F6F2}
:root{--paper:#F8F6F2;--linen:#F1EDE5;--stone:#E3DDD1;--ink:#33342F;--soft:#6B6659;--gold:#A8865B;--measure:1080px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F8F6F2;color:#33342F;font-family:'Inter',system-ui,sans-serif;font-weight:300;line-height:1.75;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--measure);margin:0 auto;padding:0 24px}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300}
h1{font-size:clamp(2.3rem,5.5vw,3.8rem);line-height:1.1}
h2{font-size:clamp(1.6rem,3vw,2.2rem)}
.eyebrow{font-size:.66rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.rule{width:52px;height:1px;background:var(--gold);margin:20px auto}
header{position:sticky;top:0;z-index:50;background:rgba(248,246,242,.94);backdrop-filter:saturate(150%) blur(8px);border-bottom:1px solid var(--stone)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 20px;max-width:var(--measure);margin:0 auto}
.brand img{height:30px;width:auto;max-width:46vw;object-fit:contain}
.back{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);white-space:nowrap;flex:none}
.back:hover{color:var(--gold)}
@media(max-width:520px){.brand img{height:22px}.back{font-size:.6rem;letter-spacing:.14em}.bar{padding:12px 14px;gap:10px}}
section{padding:clamp(56px,7vw,88px) 0}
section + section{padding-top:clamp(34px,4vw,54px)}
.steps{padding-bottom:clamp(10px,2vw,22px)}
.head{text-align:center;margin-top:clamp(56px,7vw,96px);margin-bottom:clamp(28px,4vw,44px)}
/* See collection.html: margin-bottom alone leaves a section heading pressed
   against the card above it. The same defect was in both files. */
.head:first-child{margin-top:clamp(40px,5vw,64px)}

/* hero */
.top{text-align:center;padding:clamp(44px,6vw,84px) 0 clamp(28px,4vw,48px)}
.top .lede{font-size:1.05rem;color:var(--soft);max-width:50ch;margin:18px auto 0}
.facts{display:flex;gap:30px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.fact{text-align:center}
.fact b{display:block;font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:300;line-height:1}
.fact span{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--soft)}

/* gallery */
.sell{font-size:1.12rem;color:var(--ink);max-width:46ch}
.who{font-size:.95rem;color:var(--soft);max-width:48ch;margin:12px auto 0}

/* what's included */
.list{display:grid;gap:1px;background:var(--stone);border:1px solid var(--stone)}
.row{background:var(--paper);padding:18px 22px;font-size:.96rem}
.row{display:flex;align-items:flex-start;gap:16px}
.row::before{
  content:'';flex:none;width:13px;height:13px;margin-top:.42em;border-radius:50%;
  border:1.5px solid var(--gold);
  box-shadow:inset 0 0 0 2.5px var(--paper), inset 0 0 0 3.5px var(--gold);
}

/* how it works */
.steps{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.step b{display:block;font-family:'Cormorant Garamond',serif;font-size:1.15rem;margin:10px 0 6px}
.step p{font-size:.92rem;color:var(--soft)}
.step .n{font-size:.62rem;letter-spacing:.24em;color:var(--gold)}

/* buy */
.buy{background:var(--linen);border:1px solid var(--stone);
     padding:clamp(34px,5vw,58px) clamp(24px,4vw,50px);text-align:center;
     margin-top:clamp(20px,3vw,34px)}
.price{font-family:'Cormorant Garamond',serif;font-size:clamp(2.4rem,5vw,3.4rem);line-height:1}
.price small{font-size:.82rem;letter-spacing:.1em;color:var(--soft);display:block;
             margin-top:14px;font-family:'Inter',sans-serif;line-height:1.7}
.btn{display:inline-block;padding:14px 32px;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;border:1px solid var(--gold);color:var(--ink);transition:.3s}
.btn:hover{background:var(--gold);color:var(--paper)}
.btn.solid{background:var(--gold);color:var(--paper)}
.btn.solid:hover{background:transparent;color:var(--ink)}
.buyrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.note{font-size:.85rem;color:var(--soft);max-width:44ch;margin:22px auto 0;line-height:1.7}

/* other bundles */
.more{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.mini{border:1px solid var(--stone);padding:20px;transition:border-color .3s}
.mini:hover{border-color:var(--gold)}
.mini b{display:block;font-family:'Cormorant Garamond',serif;font-size:1.1rem;margin-bottom:4px}
.mini span{font-size:.82rem;color:var(--soft)}
.mini i{display:block;font-style:normal;font-size:.7rem;letter-spacing:.2em;color:var(--gold);margin-top:10px}
.row:hover::before{box-shadow:inset 0 0 0 2.5px var(--paper), inset 0 0 0 4.5px var(--gold)}
.fine{font-size:.74rem;color:var(--soft);opacity:.8;margin:26px auto 0;max-width:44ch}
footer{border-top:1px solid var(--stone);padding:52px 0 38px;text-align:center;color:var(--soft);font-size:.72rem}
.chapter{margin:0 0 10px;font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold,#B7995C)}
.was{opacity:.45;font-weight:400;margin-left:8px}

/* THE PORTRAIT — the bundle's own pieces, photographed together. It runs full
   bleed above the title because it is the reason someone stays on the page. */
.portrait{margin:0 0 6px;background:var(--paper)}
.portrait img{display:block;width:100%;height:auto}

/* THE CONTENTS GRID — a picture of every product, not a list of nouns.
   Five words in a row look like one thing; twelve thumbnails look like twelve. */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));
      gap:26px 20px;margin-top:26px}
.item{margin:0;text-align:center}
.item img{display:block;width:100%;height:auto;background:var(--paper);
          border:1px solid var(--stone);
          box-shadow:0 6px 18px rgba(60,52,44,.07);transition:box-shadow .25s,transform .25s}
.item:hover img{box-shadow:0 12px 30px rgba(60,52,44,.13);transform:translateY(-2px)}
.item figcaption{margin-top:11px;line-height:1.35}
.item figcaption b{display:block;font-size:.9rem;font-weight:500}
.item figcaption span{display:block;margin-top:3px;font-size:.74rem;letter-spacing:.06em;
                      text-transform:uppercase;color:var(--soft)}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:20px 14px}}

/* A row with more than one design says so, and opens. */
.item.many{cursor:pointer;position:relative}
.item.many .count{position:absolute;top:8px;right:8px;width:24px;height:24px;
  border-radius:50%;background:var(--paper);border:1px solid var(--gold);
  color:var(--ink);font-size:.72rem;font-weight:500;display:flex;
  align-items:center;justify-content:center;letter-spacing:0}
.item.many:focus-visible{outline:2px solid var(--gold);outline-offset:4px}

.viewer{position:fixed;inset:0;z-index:50;display:none;
  background:rgba(24,22,19,.92);padding:clamp(18px,5vw,54px);
  flex-direction:column;justify-content:center}
.viewer.on{display:flex}
.viewer .x{position:absolute;top:14px;right:18px;background:none;border:0;
  color:#EDE9E1;font-size:2.2rem;line-height:1;cursor:pointer}
.viewer .vt{color:#EDE9E1;text-align:center;margin:0 0 4px;
  font-size:1.05rem;letter-spacing:.02em}
.viewer .vn{color:#A9A296;text-align:center;margin:14px 0 0;
  font-size:.74rem;letter-spacing:.16em;text-transform:uppercase}
.viewer .vr{display:flex;align-items:center;gap:clamp(12px,2vw,26px);
  overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 0;
  -webkit-overflow-scrolling:touch;
  /* A FLEX ITEM WILL NOT SHRINK BELOW ITS CONTENT WITHOUT THIS. The rail sits
     in a fixed, full-height column; with the default min-height:auto a tall
     picture pushed it past the viewport and the overflow was simply cut off by
     the fixed frame — no scrollbar, no warning, just a card sliced through. */
  min-height:0}
.viewer .vr::-webkit-scrollbar{display:none}
/* THE FIRST PICTURE MUST BE ABLE TO REACH THE CENTRE.
   Every image is scroll-snap-align:center, but a flex row starts at scrollLeft
   0 and the first item's centre sits LEFT of that — an unreachable snap point.
   With scroll-snap-type:x mandatory the browser must land on some snap point,
   so it skipped to the first one it could centre and the viewer opened partway
   through the document. On the Wedding Planner that meant the COVER was never
   the first thing seen: it opened on an inner vendor page. Kelly: "the planners
   are missing their front pages".
   Spacers half the rail wide at each end make the first and last centres
   reachable, so the rail opens on page one and can still snap to the last. */
.viewer .vr::before,
.viewer .vr::after{content:'';flex:0 0 50%}
/* HEIGHT LEADS, WIDTH CAPS — and it was the other way round. Pinning the width
   means a portrait card at 340px is 437px tall, which overflows a landscape
   phone. Height is the scarce dimension in a viewer. dvh follows the mobile
   browser chrome; the vh line before it is the fallback. */
.viewer .vr img{flex:0 0 auto;scroll-snap-align:center;
  max-width:min(70vw,340px);width:auto;height:auto;
  max-height:calc(100vh - 200px);max-height:calc(100dvh - 200px);
  background:var(--paper);border:1px solid rgba(255,255,255,.12)}

/* SECTION BREAKS in a long contents list. A full-width row inside the grid, so
   the tiles below it start a fresh line — a heading that did not clear the row
   would sit in a column and read as a caption. */
.phase{grid-column:1/-1;margin:22px 0 -6px;padding-top:20px;
  border-top:1px solid var(--stone);
  font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;
  color:var(--gold);text-align:left}
.phase:first-child{margin-top:0;padding-top:0;border-top:0}
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="brand" href="index.html"><img src="assets/lockup.png" alt="Willow &amp; Gild"></a>
    <a class="back" id="back" href="index.html#collections">← Back</a>
  </div>
</header>

<main id="main"></main>
<footer>© <span id="yr"></span> Willow &amp; Gild — printable stationery, instant download.</footer>

<script src="site.js"></script>
<script src="collections.js"></script>
<script src="bundles.js"></script>
<script src="contents.js"></script>
<!-- Bundle portraits, content-hashed. See the note above PORTRAIT below. -->
<script src="portraits.js"></script>
<script>
document.getElementById('yr').textContent = new Date().getFullYear();

const q = new URLSearchParams(location.search);
/* EIGHT BUNDLES SHARED ONE TITLE, across fifteen collections — a hundred and
   twenty pages reading "Bundle — Willow & Gild". */
(function () {
  const cid = q.get('c') || 'Kyoto', bid = q.get('b');
  const c0 = COLLECTIONS.find(x => x.id === cid);
  const b0 = (typeof BUNDLES !== 'undefined') && BUNDLES.find(x => x.id === bid);
  if (!c0 || !b0) return;
  applyHead({
    title: `${b0.name} — ${c0.name} — ${SITE.NAME}`,
    description: `${b0.name}: ${b0.blurb || b0.line || ''} From the ${c0.name} collection.`.slice(0, 300),
    image: `/assets/${c0.id}.jpg`,
    path: `/bundle.html?c=${cid}&b=${bid}`,
  });
})();
const b = BUNDLES.find(x => x.id === q.get('b')) || BUNDLES[0];
const c = COLLECTIONS.find(x => x.id === q.get('c')) || COLLECTIONS[0];
document.title = b.name.replace('&amp;','&') + ' — ' + c.name + ' — Willow & Gild';
document.getElementById('back').href = 'collection.html?c=' + c.id;
document.getElementById('back').textContent = '← ' + c.name;

/* Two shopfronts, and only the ones that exist — same rule as the collection
   page. A dead buy button costs more trust than a missing one. */
/* ROWS FOR THIS COLLECTION. CONTENTS_BY_COLLECTION is keyed by lane then by
   bundle, because two collections both have a 'V_The_Reception'. CONTENTS is
   the old flat shape, kept as a fallback for whichever collection was built
   last, so this page still works against an older contents.js. */
const rows = (typeof CONTENTS_BY_COLLECTION !== 'undefined'
              && CONTENTS_BY_COLLECTION[c.id] && CONTENTS_BY_COLLECTION[c.id][b.id])
             || (typeof CONTENTS !== 'undefined' && CONTENTS[b.id]) || [];

const buttons = [
  b.gumroad ? `<a class="btn solid" href="${b.gumroad}" data-buy>Buy direct</a>` : '',
  b.etsy    ? `<a class="btn" href="${b.etsy}" data-buy>Buy on Etsy</a>` : '',
].filter(Boolean).join('');

/* The gallery uses the collection's own three views plus the bundle shot, so a
   bundle always looks like the collection it is being bought in. */

/* WHERE THE PORTRAIT LIVES — try, do not assume.
   These files have been packaged three different ways during the build, so a
   repo may hold them at any of the paths below depending on which zip went up.
   A hard-coded path turns a naming difference into a missing image on a live
   page; a short fallback chain costs one failed request and cannot be wrong.
   The order is most-recent-first, and the figure removes itself if none hit. */
/* THE HASHED NAME COMES FIRST, FROM portraits.js.

   vercel.json serves /assets/ with max-age=31536000, immutable. Under that
   header a fixed filename is a promise that the name never changes meaning -
   and an unhashed portrait cannot keep it. Riviera's portraits did not exist
   yet, a browser asked for the fixed name, cached the 404 for a year, and
   afterwards served that cached miss instead of the file that had since gone
   up. onerror fired, the chain fell through, and every Riviera bundle page
   showed Kyoto's cranes. Refreshing could not clear it: the HTML is
   must-revalidate, but the image was never re-requested.

   Every other tile in the folder was already content-hashed for exactly this
   reason. The portraits now are too, and the hash is looked up here. The old
   fixed paths stay on as the tail of the chain so collections that have not
   been rebuilt yet keep working untouched. */
const HASHED = (typeof PORTRAITS === 'object' && PORTRAITS)
  ? (PORTRAITS[c.id.toLowerCase()] || {})[b.id]
  : null;
const PORTRAIT = [
  ...(HASHED ? [`assets/${c.id.toLowerCase()}/${HASHED}`] : []),
  `assets/${c.id.toLowerCase()}/bundle-${b.id}.webp`,
  `assets/bundles/${b.id}.webp`,
  `assets/bundles/bundle-${b.id}.webp`,
  `assets/bundle-${b.id}.webp`,
];
function nextPortrait(img) {
  const n = +img.dataset.try + 1;
  if (n < PORTRAIT.length) { img.dataset.try = n; img.src = PORTRAIT[n]; }
  else { const f = img.closest('figure'); if (f) f.remove(); }
}

document.getElementById('main').innerHTML = `
  <figure class="portrait">
    <img src="${PORTRAIT[0]}" alt="${b.name} — what is inside" loading="eager"
         data-try="0" onerror="nextPortrait(this)">
  </figure>

  <div class="top wrap">
    <p class="eyebrow">${c.name} — Bundle</p>
    <div class="rule"></div>
    <h1 class="serif">${b.name}</h1>
    <p class="lede sell">${b.sell || b.line}</p>
    <p class="who">${b.who}</p>
    <div class="facts">
      <div class="fact"><b>${b.pages || '—'}</b><span>Pages</span></div>
      <div class="fact"><b>${b.files}</b><span>Files</span></div>
      <div class="fact"><b>A4 · US</b><span>Both sizes</span></div>
    </div>
  </div>

  <!-- THE SHOTS RAIL IS GONE. It was a horizontally scrolling strip of the
       same square product photos the portrait and the icon grid now cover
       properly — the portrait shows the pieces together at the top, the grid
       shows every one of them below. A third pass at the same content, needing
       a swipe to see it, was the weakest of the three and the only one that
       hid what it held. -->

  <section class="wrap">
    <div class="head"><p class="eyebrow">What's Included</p>
      <h2 class="serif">Every piece, shown</h2><div class="rule"></div>
      <p style="color:var(--soft);max-width:52ch;margin:12px auto 0">
        ${rows.length} products in this chapter. Every one is pictured as it prints.</p></div>
    ${rows.length ? `<div class="grid">${rows.map(r => `${r.section ? `
      <p class="phase">${r.section}</p>` : ''}
      <figure class="item${r.all ? ' many' : ''}"${r.all ? ` data-all="${r.all.join(',')}" data-name="${r.name}" data-note="${r.note || ''}" tabindex="0" role="button" aria-label="${r.name}, ${r.pages || r.all.length} pages — open"` : ''}>
        <img src="assets/${c.id.toLowerCase()}/${r.icon}" alt="${r.name}" loading="lazy">
        <!-- THE BADGE COUNTS PAGES WHERE THE ROW KNOWS ITS PAGE COUNT.
             A page gallery de-dupes renders that look alike, so a twelve-page
             seating plan with four deliberate continuation pairs showed 7.
             r.pages is the real page count and wins where it exists.
             AND A COUNT OF ONE IS NOT A COUNT. The badge is drawn from r.all,
             which exists as soon as a row has a gallery at all — so a
             single-page product got a badge reading "1" sitting over its
             corner, saying nothing. Kelly, on the here-comes-the-bride sign:
             "why is there a number 1". Every other badge on the page reads 3,
             4, 6, 12 and means "there is more here than you can see". One
             means the opposite, so it is not shown. -->
        ${r.all && (r.pages || r.all.length) > 1 ? `<b class="count">${r.pages || r.all.length}</b>` : ''}
        <figcaption><b>${r.name}</b>${r.note ? `<span>${r.note}</span>` : ''}</figcaption>
      </figure>`).join('')}</div>`
      : `<div class="list">${b.includes.map(i => `<div class="row">${i}</div>`).join('')}</div>`}
  </section>

  <section class="wrap">
    <div class="head"><p class="eyebrow">How It Works</p><h2 class="serif">Three steps, no software to buy</h2><div class="rule"></div></div>
    <div class="steps">
      <div class="step"><span class="n">ONE</span><b>Download</b>
        <p>Your files arrive the moment you pay. Nothing is posted and nothing expires.</p></div>
      <div class="step"><span class="n">TWO</span><b>Type your details</b>
        <p>Open in any free PDF reader — Acrobat Reader, Preview, your phone. On the synced documents you type your names once and every page fills.</p></div>
      <div class="step"><span class="n">THREE</span><b>Print</b>
        <p>At home, at a copy shop, or send the file to a printer. A4 and US Letter are both included, with a print guide that tells them exactly what they need.</p></div>
    </div>
  </section>

  <section class="wrap">
    <div class="buy">
      <p class="eyebrow">Instant Download</p>
      <p class="chapter">${b.chapter && b.chapter !== "\u2014" ? `Chapter ${b.chapter} · ${b.when}` : b.when}</p>
      <p class="price">NZ$${b.price}${b.wasPrice ? ` <s class="was">NZ$${b.wasPrice}</s>` : ''}<small>${b.wasPrice ? `every chapter, for less than half of buying them separately · ` : ''}one payment · yours to keep · print as many as you need</small></p>
      <div class="buyrow">${buttons}</div>
      ${(!b.etsy && !b.gumroad) ? '<p class="note">Listings going live shortly.</p>' : ''}
      <p class="note">Bundles work across collections &mdash; take the invitations from
        one and the reception from another if you would rather mix.</p>
      <p class="fine">Personal use for your own wedding. Not for resale or redistribution.</p>
    </div>
  </section>

  <section class="wrap">
    <div class="head"><p class="eyebrow">Other Bundles in ${c.name}</p><div class="rule"></div></div>
    <div class="more">
      ${BUNDLES.filter(x => x.id !== b.id).slice(0, 4).map(x => `
        <a class="mini" href="bundle.html?b=${x.id}&c=${c.id}">
          <b>${x.name}</b><span>${x.line}</span><i>NZ$${x.price}</i>
        </a>`).join('')}
    </div>
  </section>`;


/* THE DESIGN VIEWER.
   A row that says '6 designs' and shows one of them is telling the customer
   about a choice they cannot see — and the choice IS the proposition here, so
   it has to be openable. Any row with more than one design becomes a button;
   opening it lays the designs out to swipe through, with the keyboard arrows
   working for anyone on a desktop. */
(function () {
  const grid = document.querySelector('.grid');
  if (!grid) return;

  const box = document.createElement('div');
  box.className = 'viewer';
  box.innerHTML = '<button class="x" aria-label="Close">&times;</button>' +
                  '<p class="vt"></p><div class="vr"></div>' +
                  '<p class="vn"></p>';
  document.body.appendChild(box);
  const rail = box.querySelector('.vr');

  function open(fig) {
    const all = fig.dataset.all.split(',');
    box.querySelector('.vt').textContent = fig.dataset.name;
    box.querySelector('.vn').textContent =
      // SAY WHAT THE ROW SAYS. The note already describes the AXES a customer
      // picks from — 'for posts & stories · 5 messages · 3 photo shapes' —
      // after '20 designs' was found to oversell by multiplying them together.
      // The viewer was a SECOND copy of the same claim and went on saying 20
      // over a row that had just stopped. Where a row has no note, count
      // PICTURES: that is what is on screen to swipe, and it claims nothing
      // about how many drawings the product contains.
      (fig.dataset.note || (all.length + ' pictures')) +
      ' — swipe, or use the arrow keys';
    rail.innerHTML = all.map(f =>
      '<img src="assets/' + c.id.toLowerCase() + '/' + f + '" alt="">').join('');
    // OPEN ON PAGE ONE, EVERY TIME. The rail keeps its scroll position from the
    // previous row it showed, so the second product opened wherever the first
    // was left. Reset before showing, not after, or the jump is visible.
    rail.scrollLeft = 0;
    box.classList.add('on');
    document.body.style.overflow = 'hidden';
  }
  function close() {
    box.classList.remove('on');
    document.body.style.overflow = '';
  }

  grid.addEventListener('click', e => {
    const fig = e.target.closest('.item.many');
    if (fig) open(fig);
  });
  grid.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const fig = e.target.closest('.item.many');
    if (fig) { e.preventDefault(); open(fig); }
  });
  box.querySelector('.x').onclick = close;
  box.addEventListener('click', e => { if (e.target === box) close(); });
  document.addEventListener('keydown', e => {
    if (!box.classList.contains('on')) return;
    if (e.key === 'Escape') return close();
    const step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (step) rail.scrollBy({left: step * rail.clientWidth * 0.8,
                             behavior: 'smooth'});
  });
})();

</script>
</body>
</html>
