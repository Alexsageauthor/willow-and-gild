<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#F8F6F2">
<title>Collection — Willow &amp; Gild</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ONE PAGE SERVES EVERY COLLECTION. Fifteen near-identical HTML files would
   drift the moment one of them was edited; this reads ?c=Kyoto and builds
   itself from collections.js, so a new collection is a data entry and an
   image, never a new page to keep in step. */
html{color-scheme:light only}
:root{
  --paper:#F8F6F2;--linen:#F1EDE5;--stone:#E3DDD1;
  --ink:#33342F;--soft:#6B6659;--gold:#A8865B;--measure:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
     font-weight:300;line-height:1.75;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--measure);margin:0 auto;padding:0 32px}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300}
h1{font-size:clamp(2.6rem,6vw,4.4rem);line-height:1.08}
h2{font-size:clamp(1.8rem,3.4vw,2.6rem)}
.eyebrow{font-size:.68rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.rule{width:54px;height:1px;background:var(--gold);margin:22px auto}
header{position:sticky;top:0;z-index:50;background:rgba(248,246,242,.92);
       backdrop-filter:saturate(150%) blur(8px);border-bottom:1px solid var(--stone)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 20px;
     max-width:var(--measure);margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:30px;width:auto;max-width:46vw;object-fit:contain}
@media(max-width:520px){
  .brand img{height:22px}
  .back{font-size:.6rem;letter-spacing:.14em}
  .bar{padding:12px 14px;gap:10px}
}
.brand span{display:none}   /* the lockup carries the name itself */
.back{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);
      white-space:nowrap;flex:none}
.back:hover{color:var(--gold)}
.hero{text-align:center;padding:clamp(56px,8vw,110px) 0 clamp(36px,5vw,66px)}
.hero img{width:min(360px,62vw);margin:0 auto clamp(20px,3vw,36px)}
.lede{font-size:1.06rem;color:var(--soft);max-width:56ch;margin:22px auto 0}
.palette{display:flex;gap:12px;justify-content:center;margin-top:30px}
.palette i{width:34px;height:34px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.06)}
section{padding:clamp(64px,8vw,104px) 0}
section + section{padding-top:clamp(40px,5vw,64px)}
.head{text-align:center;margin-top:clamp(56px,7vw,96px);margin-bottom:clamp(30px,4vw,52px)}
/* SPACE ABOVE A HEADING, NOT ONLY BELOW IT. .wrap carries horizontal padding
   only (0 32px), so a section began exactly where the one above ended and the
   eyebrow sat hard against the previous card — 'What's Included' under the
   bundle boxes, 'Also in the house' under the coming-soon panel. Kelly: "so
   crammed underneath the box, there should be some breathing space there."
   The gap belongs on the heading because every section starts with one, so it
   cannot be forgotten the next time a section is added. First .head on the
   page keeps its own spacing from the hero below. */
.head:first-child{margin-top:clamp(40px,5vw,64px)}
.list{display:grid;gap:1px;background:var(--stone);border:1px solid var(--stone)}
.row{background:var(--paper);padding:26px 28px;display:grid;gap:6px;
     grid-template-columns:minmax(210px,1fr) 2fr;align-items:baseline}
.row h3{font-size:1.16rem}
.row p{font-size:.92rem;color:var(--soft)}
@media(max-width:700px){.row{grid-template-columns:1fr}}
.buybox{background:var(--linen);border:1px solid var(--stone);padding:clamp(30px,4vw,54px);text-align:center}
.btn{display:inline-block;padding:14px 34px;font-size:.72rem;letter-spacing:.22em;
     text-transform:uppercase;border:1px solid var(--gold);color:var(--ink);transition:.3s}
.btn:hover{background:var(--gold);color:var(--paper)}
.btn.solid{background:var(--gold);color:var(--paper)}
.btn.solid:hover{background:transparent;color:var(--ink)}
.buyrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.views{display:grid;gap:clamp(18px,2.6vw,34px);
       grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.view{margin:0;text-align:center}
.view img{width:100%;transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.view a{display:block;overflow:hidden}
.view a:hover img{transform:scale(1.03)}
.view figcaption{margin-top:14px;margin-bottom:6px;font-size:.66rem;letter-spacing:.24em;
                 text-transform:uppercase;color:var(--soft)}
.bundles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.bcard{border:1px solid var(--stone);padding:22px;transition:border-color .3s,transform .3s;display:block}
.bcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.bcard.hero{border-color:var(--gold);background:var(--linen)}
.bcard b{display:block;font-family:'Cormorant Garamond',serif;font-size:1.16rem;font-weight:300;margin-bottom:5px}
.bcard span{font-size:.88rem;color:var(--soft)}
.bcard i{display:block;font-style:normal;font-size:.68rem;letter-spacing:.2em;color:var(--gold);margin-top:12px}
.more{display:grid;gap:26px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin-top:12px}
.mini{background:transparent;text-align:center;padding-bottom:20px;opacity:.62}
.mini.live{opacity:1}
.mini .art{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.mini .art img{width:80%}
.mini h3{font-size:1.05rem;margin-top:16px}
.mini span{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--soft)}
footer{border-top:1px solid var(--stone);padding:56px 0 40px;text-align:center;color:var(--soft);font-size:.72rem}
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="brand" href="index.html"><img src="assets/wordmark.png" alt="Willow &amp; Gild"></a>
    <a class="back" href="index.html#collections">← All collections</a>
  </div>
</header>

<main id="main"></main>

<footer>© <span id="yr"></span> Willow &amp; Gild — printable stationery, instant download.</footer>

<script src="site.js"></script>
<script src="collections.js"></script>
<script src="bundles.js"></script>
<script>
document.getElementById('yr').textContent = new Date().getFullYear();

const id = new URLSearchParams(location.search).get('c') || 'Kyoto';
/* FIFTEEN COLLECTIONS SHARED ONE TITLE. This page serves them all off ?c=, so
   in a search result every lane was the same blue link reading "Collection —
   Willow & Gild". The card image is the lane's own tile. */
(function () {
  const c0 = COLLECTIONS.find(x => x.id === id);
  if (!c0) return;
  applyHead({
    title: `${c0.name} — Printable Wedding Stationery — ${SITE.NAME}`,
    description: `${c0.line} ${c0.story}`.slice(0, 300),
    image: `/assets/${c0.id}.jpg`,
    path: `/collection.html?c=${c0.id}`,
  });
})();
const c  = COLLECTIONS.find(x => x.id === id) || COLLECTIONS[0];
document.title = c.name + ' — Willow & Gild';

const live = c.status === 'live';

/* Every bundle is reachable from every collection page, carrying the
   collection through in the query string so the bundle shows in ITS colours. */
const bundleCards = (typeof BUNDLES === 'undefined' ? [] : BUNDLES).map(x => `
  <a class="bcard${x.hero ? ' hero' : ''}" href="bundle.html?b=${x.id}&c=${c.id}">
    <b>${x.name}</b>
    <span>${x.line}</span>
    <i>NZ$${x.price}${x.pages ? ' &middot; ' + x.pages + ' pages' : ''}</i>
  </a>`).join('');

/* FOUR VIEWS, AND ONLY THE ONES THAT EXIST.
   The plate is the table, the chair is the room, the hero is the drawing the
   lane is built from, and the cake is the day itself. A view is drawn if its
   file is there and skipped silently if not - a gallery with a broken image in
   it is worse than a gallery of three.

   'THE DRAWING' WAS RENAMED TO 'THE SIGNATURE'. It distinguished nothing: the
   plate, the chair and the cake are every bit as drawn as the hero is, and
   since the heroes were restaged the first view is a massed watercolour rather
   than a line drawing — the word described it least accurately of the four.
   What it IS is the image that identifies the collection: the one on the tile,
   the invitation and the planner cover.

   THE CAKE GOES LAST ON PURPOSE. The first three run signature -> detail ->
   space,
   which is a sequence, not a list; the cake is the thing all of it is FOR, so
   it closes rather than opens. It is also the most arresting of the four, and
   an arresting image at the top makes the three after it look like footnotes.
   The order of the first three is unchanged - it was a design decision. */
const VIEWS = [
  ['_hero',  'The Signature'],
  ['',       'The Table'],
  ['_chair', 'The Room'],
  ['_cake',  'The Cake'],
];
const views = VIEWS.map(([suf, label]) => `
  <figure class="view">
    <a href="index.html#collections" aria-label="${c.name} — ${label}, see all collections">
      <img src="assets/${c.id}${suf}.webp?v=${V}" alt="${c.name} — ${label}" loading="lazy"
           onerror="this.closest('figure').remove()">
    </a>
    <figcaption>${label}</figcaption>
  </figure>`).join('');

/* TWO SHOPFRONTS, AND ONLY THE ONES THAT EXIST.
   Gumroad is the direct channel and takes the smaller cut, so it leads. Etsy
   is where the search traffic is, so it stays - a customer who trusts Etsy
   should not have to leave to buy. A button is only drawn if its link is
   actually filled in: a dead buy button costs more trust than a missing one. */
/* CACHE-BUST THE STABLE-NAMED VIEWS.
   The four gallery views are Woodlands_hero.webp and friends — FIXED names, not
   content hashes. Re-cut art writes new bytes under the same URL, so the browser
   and the CDN both keep serving what they already hold and an upload changes
   nothing on screen. Woodlands showed the old stump for hours after the birds
   were live in the repo. The per-product tiles never have this problem because
   their name IS their content.
   V is bumped whenever the views are re-cut. It is the only thing that makes a
   stable-named asset re-fetch. */
const V = '20260828';

const buttons = [
  c.gumroad ? `<a class="btn solid" href="${c.gumroad}" data-buy>Buy direct</a>` : '',
  c.etsy    ? `<a class="btn" href="${c.etsy}" data-buy>Buy on Etsy</a>`        : '',
].filter(Boolean).join('');

const products = live ? `
  <section class="wrap">
    <div class="head">
      <p class="eyebrow">What's Included</p>
      <h2 class="serif">Every piece, designed together</h2>
      <div class="rule"></div>
    </div>
    <div class="list">
      ${KYOTO_PRODUCTS.map(([t,d]) => `<div class="row"><h3 class="serif">${t}</h3><p>${d}</p></div>`).join('')}
    </div>
  </section>

  <section class="wrap">
    <div class="buybox">
      <p class="eyebrow">The Complete Collection</p>
      <h2 class="serif" style="margin:12px 0 6px">${c.name}</h2>
      <p style="color:var(--soft);max-width:46ch;margin:0 auto 8px">
        Instant download. Edit in any free PDF reader — no software to buy,
        no account to make.
      </p>
      <p style="color:var(--soft);max-width:46ch;margin:0 auto 26px">
        Also available as eight smaller bundles \u2014 if you only need part of it, or want to mix and match across collections.
      </p>
      <div class="buyrow">${buttons}</div>
      ${(!c.etsy && !c.gumroad) ? '<p style="color:var(--soft);font-size:.85rem;margin-top:18px">Listings going live shortly.</p>' : ''}
    </div>
  </section>` : `
  <section class="wrap">
    <div class="buybox">
      <p class="eyebrow">In the studio</p>
      <h2 class="serif" style="margin:12px 0 10px">Not quite ready</h2>
      <p style="color:var(--soft);max-width:48ch;margin:0 auto 26px">
        ${c.name} is drawn and built, and it goes on sale once it has been
        through the same checks as every collection before it. Nothing here is
        sold before it is finished.
      </p>
      <a class="btn" href="index.html#collections">See what's available now</a>
    </div>
  </section>`;

document.getElementById('main').innerHTML = `
  <div class="hero wrap">
    <img src="assets/${c.id}.webp?v=${V}" alt="${c.name}">
    <p class="eyebrow">The Collection</p>
    <div class="rule"></div>
    <h1 class="serif">${c.name}</h1>
    <p class="lede">${c.story}</p>
    <div class="palette">
      <i style="background:${c.ink}" title="ink"></i>
      <i style="background:${c.gold}" title="gold"></i>
      <i style="background:var(--paper);border-color:var(--stone)" title="paper"></i>
    </div>
  </div>

  <section class="wrap">
    <div class="head">
      <p class="eyebrow">The Collection</p>
      <h2 class="serif">Four views of one world</h2>
      <div class="rule"></div>
    </div>
    <div class="views">${views}</div>
  </section>

  <section class="wrap">
    <div class="head">
      <p class="eyebrow">Buy the Whole Collection, or Part of It</p>
      <h2 class="serif">Eight ways in</h2>
      <div class="rule"></div>
      <p style="color:var(--soft);max-width:52ch;margin:14px auto 0">
        The complete collection, or a smaller bundle if you only need part of it
        &mdash; or want to mix and match across collections.
      </p>
    </div>
    <div class="bundles">${bundleCards}</div>
  </section>
  ${products}
  <section class="wrap">
    <div class="head"><p class="eyebrow">Also in the house</p><div class="rule"></div></div>
    <div class="more">
      ${COLLECTIONS.filter(x => x.id !== c.id).slice(0, 4).map(x => `
        <a class="mini ${x.status === 'live' ? 'live' : ''}" href="collection.html?c=${x.id}">
          <div class="art"><img src="assets/${x.id}.webp?v=${V}" alt="${x.name}" loading="lazy"></div>
          <h3 class="serif">${x.name}</h3>
          <span>${x.status === 'live' ? 'Available' : 'Coming soon'}</span>
        </a>`).join('')}
    </div>
  </section>`;
</script>
</body>
</html>
